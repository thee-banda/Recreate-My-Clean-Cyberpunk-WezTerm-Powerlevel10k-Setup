<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clean cyberpunk WezTerm and Powerlevel10k terminal mockup</title>
  <desc id="desc">A dark translucent terminal with transparent prompt segments, drawn icons, cyan path text, green prompt arrows, pastel status, Node version, and clock text.</desc>
  <defs>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 140) rotate(35) scale(430 280)">
      <stop stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 580) rotate(145) scale(430 260)">
      <stop stop-color="#86efac" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="150" y1="116" x2="1130" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.42" stop-color="#11111b"/>
      <stop offset="1" stop-color="#0f1020"/>
    </linearGradient>
    <filter id="window-shadow" x="70" y="54" width="1140" height="620" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <filter id="soft-cyan" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38d9ff" flood-opacity="0.26"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .path-text { fill: #38d9ff; font-weight: 700; }
      .cmd { fill: #cdd6f4; font-weight: 700; }
      .muted { fill: #a6adc8; }
      .ok { fill: #86efac; font-weight: 800; }
      .pink { fill: #f9a8d4; font-weight: 800; }
      .time { fill: #e9d5ff; font-weight: 800; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0b1020"/>
  <rect width="1280" height="720" fill="url(#cyan-glow)"/>
  <rect width="1280" height="720" fill="url(#green-glow)"/>

  <g filter="url(#window-shadow)">
    <rect x="100" y="78" width="1080" height="560" rx="24" fill="url(#screen)" stroke="#313244" stroke-width="2"/>
    <path d="M100 102C100 88.7452 110.745 78 124 78H1156C1169.25 78 1180 88.7452 1180 102V132H100V102Z" fill="#181825"/>
    <circle cx="132" cy="105" r="8" fill="#f38ba8"/>
    <circle cx="158" cy="105" r="8" fill="#f9e2af"/>
    <circle cx="184" cy="105" r="8" fill="#a6e3a1"/>
    <text x="640" y="112" text-anchor="middle" class="mono muted" font-size="16" font-weight="700">wezterm · zsh · powerlevel10k</text>
  </g>

  <g transform="translate(148 180)">
    <g id="os-icon" fill="#f5f7ff">
      <circle cx="8" cy="15" r="8"/>
      <rect x="0" y="14" width="16" height="18" rx="7"/>
      <path d="M12 0C14.6 2.5 14.1 6.2 10.2 8.2C7.9 5.8 8.5 2.1 12 0Z"/>
    </g>
    <g id="folder-icon" transform="translate(52 2)" fill="#38d9ff" filter="url(#soft-cyan)">
      <path d="M2 11C2 7.7 4.7 5 8 5H24L30 11H52C55.3 11 58 13.7 58 17V40C58 43.3 55.3 46 52 46H8C4.7 46 2 43.3 2 40V11Z"/>
      <path d="M2 18H58L53 46H7L2 18Z" opacity="0.72"/>
    </g>
    <text x="126" y="34" class="mono path-text" font-size="34" fill="#38d9ff">~/.config/wezterm</text>
    <text x="828" y="34" text-anchor="end" class="mono ok" font-size="30">24.15.0</text>
    <path d="M854 16L868 8L882 16V32L868 40L854 32V16Z" fill="#a6e3a1"/>
    <text x="976" y="34" text-anchor="end" class="mono time" font-size="30">09:41</text>
    <circle cx="1008" cy="23" r="13" stroke="#e9d5ff" stroke-width="4"/>
    <path d="M1008 14V24L1016 29" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/>

    <text x="0" y="104" class="mono ok" font-size="38">❯</text>
    <text x="52" y="104" class="mono cmd" font-size="34">source ~/.zshrc</text>
  </g>

  <g transform="translate(148 342)">
    <use href="#os-icon"/>
    <use href="#folder-icon"/>
    <text x="126" y="34" class="mono path-text" font-size="34" fill="#38d9ff">~/projects/cyber-term</text>
    <text x="828" y="34" text-anchor="end" class="mono ok" font-size="30">24.15.0</text>
    <path d="M854 16L868 8L882 16V32L868 40L854 32V16Z" fill="#a6e3a1"/>
    <text x="976" y="34" text-anchor="end" class="mono time" font-size="30">09:42</text>
    <circle cx="1008" cy="23" r="13" stroke="#e9d5ff" stroke-width="4"/>
    <path d="M1008 14V24L1016 29" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/>

    <text x="0" y="104" class="mono ok" font-size="38">❯</text>
    <text x="52" y="104" class="mono cmd" font-size="34">codex</text>
  </g>

  <g transform="translate(148 504)">
    <use href="#os-icon"/>
    <use href="#folder-icon"/>
    <text x="126" y="34" class="mono path-text" font-size="34" fill="#38d9ff">~/clean-prompt</text>
    <text x="690" y="34" text-anchor="end" class="mono pink" font-size="30">127 ↵</text>
    <text x="840" y="34" text-anchor="end" class="mono ok" font-size="30">24.15.0</text>
    <path d="M864 16L878 8L892 16V32L878 40L864 32V16Z" fill="#a6e3a1"/>
    <text x="976" y="34" text-anchor="end" class="mono time" font-size="30">09:43</text>
    <circle cx="1012" cy="23" r="13" stroke="#e9d5ff" stroke-width="4"/>
    <path d="M1012 14V24L1020 29" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/>

    <text x="0" y="104" class="mono ok" font-size="38">❯</text>
    <rect x="52" y="70" width="20" height="46" rx="4" fill="#a6e3a1"/>
  </g>
</svg>
